<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No. 26：ワイソフの石取りゲーム（2山）</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f2f5;
      margin: 0;
      padding: 10px 20px;
      height: 100vh;
      justify-content: space-between;
    }
    .header {
      text-align: center;
    }
    .game-num {
      font-size: 0.85rem;
      color: #666;
      font-weight: bold;
    }
    h1 {
      margin: 2px 0 6px 0;
      font-size: 1.4rem;
    }
    #status {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 6px;
      transition: all 0.3s;
      margin-bottom: 5px;
    }
    .p1-turn { color: #1e88e5; background: #e3f2fd; }
    .p2-turn { color: #e53935; background: #ffebee; }

    /* 勝利時のステータス強調 */
    .game-over-status {
      font-size: 1.4rem !important;
      background: #fff3e0 !important;
      color: #e65100 !important;
      border: 2px solid #ffa726;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .board-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 750px;
    }

    /* 終了時ハイライト */
    .board-container.game-over {
      background: #fff59d;
      box-shadow: 0 0 20px rgba(255, 214, 0, 0.8), 0 4px 12px rgba(0,0,0,0.15);
    }

    /* 石の山のディスプレイ */
    .piles-wrapper {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 20px;
      gap: 20px;
    }

    .pile-box {
      flex: 1;
      background: #fafafa;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pile-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #37474f;
      margin-bottom: 10px;
    }

    .stones-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      min-height: 80px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
      width: 100%;
    }

    .stone {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #78909c, #37474f);
      box-shadow: 0 3px 5px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    /* 操作エリア */
    .control-panel {
      width: 100%;
      background: #f1f8e9;
      border: 2px solid #c5e1a5;
      border-radius: 8px;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .mode-options {
      display: flex;
      gap: 15px;
      font-weight: bold;
      color: #333;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 6px;
      background: white;
      border: 1px solid #ccc;
    }

    .take-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .take-select {
      font-size: 1.1rem;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #999;
      font-weight: bold;
    }

    .exec-btn {
      padding: 10px 28px;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      transition: background 0.15s;
    }

    .exec-btn.p1-btn { background: #1976d2; }
    .exec-btn.p1-btn:hover:not(:disabled) { background: #1565c0; }

    .exec-btn.p2-btn { background: #d32f2f; }
    .exec-btn.p2-btn:hover:not(:disabled) { background: #c62828; }

    .exec-btn:disabled {
      background: #cfd8dc !important;
      color: #90a4ae !important;
      cursor: not-allowed;
    }

    .controls {
      margin-top: 5px;
    }
    .reset-btn {
      padding: 8px 24px;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #4caf50;
      color: white;
      font-weight: bold;
    }
    .reset-btn:hover { background: #43a047; }

    .rules {
      width: 100%;
      max-width: 750px;
      padding: 8px 15px;
      background: white;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.3;
      color: #555;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="game-num">No. 26</div>
    <h1>ワイソフの石取りゲーム（2山）</h1>
  </div>

  <div id="status" class="p1-turn">プレイヤー 1 の番です</div>

  <div id="container" class="board-container">
    <div class="piles-wrapper">
      <div class="pile-box">
        <div class="pile-title">山 A ( <span id="cnt-a">7</span> 個 )</div>
        <div id="stones-a" class="stones-container"></div>
      </div>
      <div class="pile-box">
        <div class="pile-title">山 B ( <span id="cnt-b">5</span> 個 )</div>
        <div id="stones-b" class="stones-container"></div>
      </div>
    </div>

    <div class="control-panel">
      <div class="mode-options">
        <label class="mode-label">
          <input type="radio" name="mode" value="a" checked onclick="updateControls()"> 山Aから取る
        </label>
        <label class="mode-label">
          <input type="radio" name="mode" value="b" onclick="updateControls()"> 山Bから取る
        </label>
        <label class="mode-label">
          <input type="radio" name="mode" value="both" onclick="updateControls()"> 両方の山から同じ数取る
        </label>
      </div>

      <div class="take-controls">
        <span>取る個数:</span>
        <select id="take-count" class="take-select" onchange="updateUI()"></select>
        <span>個</span>
      </div>

      <button id="exec-btn" class="exec-btn p1-btn" onclick="executeTurn()">石を取る</button>
    </div>
  </div>

  <div class="controls">
    <button class="reset-btn" onclick="resetGame()">最初からやり直す</button>
  </div>

  <div class="rules">
    <span><b>【ルール】</b> 1つの山から好きなだけ、または<b>両方の山から同時に同じ個数</b>取ることができます。</span>
    <span><b>【勝利条件】</b> 最後に石を取って<b>相手に石を取れなくしたプレイヤーの勝ち</b>です。</span>
  </div>

  <script>
    let countA = 7;
    let countB = 5;

    let currentPlayer = 1;
    let gameOver = false;

    const stonesAEl = document.getElementById('stones-a');
    const stonesBEl = document.getElementById('stones-b');
    const cntAEl = document.getElementById('cnt-a');
    const cntBEl = document.getElementById('cnt-b');
    const statusEl = document.getElementById('status');
    const containerEl = document.getElementById('container');
    const takeSelect = document.getElementById('take-count');
    const execBtn = document.getElementById('exec-btn');

    function renderStones() {
      stonesAEl.innerHTML = '';
      stonesBEl.innerHTML = '';

      for (let i = 0; i < countA; i++) {
        const stone = document.createElement('div');
        stone.className = 'stone';
        stonesAEl.appendChild(stone);
      }

      for (let i = 0; i < countB; i++) {
        const stone = document.createElement('div');
        stone.className = 'stone';
        stonesBEl.appendChild(stone);
      }

      cntAEl.textContent = countA;
      cntBEl.textContent = countB;

      updateControls();
    }

    function getSelectedMode() {
      const modes = document.getElementsByName('mode');
      for (let m of modes) {
        if (m.checked) return m.value;
      }
      return 'a';
    }

    function updateControls() {
      if (gameOver) return;

      const mode = getSelectedMode();
      let maxTake = 0;

      if (mode === 'a') {
        maxTake = countA;
      } else if (mode === 'b') {
        maxTake = countB;
      } else if (mode === 'both') {
        maxTake = Math.min(countA, countB);
      }

      const currentVal = parseInt(takeSelect.value) || 1;
      takeSelect.innerHTML = '';

      if (maxTake === 0) {
        const opt = document.createElement('option');
        opt.value = 0;
        opt.textContent = '0';
        takeSelect.appendChild(opt);
        execBtn.disabled = true;
      } else {
        for (let i = 1; i <= maxTake; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = i;
          takeSelect.appendChild(opt);
        }
        takeSelect.value = Math.min(currentVal, maxTake);
        execBtn.disabled = false;
      }

      execBtn.className = currentPlayer === 1 ? 'exec-btn p1-btn' : 'exec-btn p2-btn';
    }

    function executeTurn() {
      if (gameOver) return;

      const mode = getSelectedMode();
      const num = parseInt(takeSelect.value);

      if (isNaN(num) || num <= 0) return;

      if (mode === 'a') {
        countA -= num;
      } else if (mode === 'b') {
        countB -= num;
      } else if (mode === 'both') {
        countA -= num;
        countB -= num;
      }

      renderStones();

      // 勝敗判定（両方の山が0になったら勝利）
      if (countA === 0 && countB === 0) {
        gameOver = true;
        statusEl.textContent = `🎉 ゲーム終了！ 最後の石を取った プレイヤー ${currentPlayer} (${currentPlayer === 1 ? '先手' : '後手'}) の勝利！`;
        statusEl.className = (currentPlayer === 1 ? 'p1-turn' : 'p2-turn') + ' game-over-status';
        containerEl.classList.add('game-over');
        execBtn.disabled = true;
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      statusEl.textContent = `プレイヤー ${currentPlayer} の番です`;
      statusEl.className = currentPlayer === 1 ? 'p1-turn' : 'p2-turn';
      updateControls();
    }

    function updateUI() {
      // 選択変更時のイベント用
    }

    function resetGame() {
      countA = 7;
      countB = 5;
      currentPlayer = 1;
      gameOver = false;

      statusEl.textContent = 'プレイヤー 1 の番です';
      statusEl.className = 'p1-turn';
      containerEl.classList.remove('game-over');
      renderStones();
    }

    renderStones();
  </script>
</body>
</html>
