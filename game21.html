<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No. 21：8x8 斜め×取りゲーム</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 10px;
    }
    .game-num {
      font-size: 0.9rem;
      color: #666;
      font-weight: bold;
    }
    h1 {
      margin: 5px 0 10px 0;
      font-size: 1.6rem;
    }
    #status {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 6px 12px;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .p1-turn { color: #1e88e5; }
    .p2-turn { color: #e53935; }

    /* 勝利時のステータス強調 */
    .game-over-status {
      font-size: 1.4rem !important;
      background: #fff3e0;
      border: 2px solid #ffa726;
      padding: 10px 20px !important;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .board-container {
      background: #333;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* ゲーム終了時の背景黄色（ゴールド）ハイライト */
    .board-container.game-over {
      background: #fff59d;
      box-shadow: 0 0 20px rgba(255, 214, 0, 0.8), 0 4px 12px rgba(0,0,0,0.15);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 45px);
      grid-template-rows: repeat(8, 45px);
      gap: 2px;
      background: #333;
      padding: 4px;
      border-radius: 6px;
    }
    .cell {
      width: 45px;
      height: 45px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .cell.preview { background: #e0f7fa; }
    .cell.taken-p1 { background: #bbdefb; color: #1565c0; cursor: not-allowed; }
    .cell.taken-p2 { background: #ffcdd2; color: #c62828; cursor: not-allowed; }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #4caf50;
      color: white;
      font-weight: bold;
    }
    button:hover { background: #43a047; }
    .rules {
      max-width: 400px;
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #444;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="game-num">No. 21</div>
    <h1>8×8 斜め×取りゲーム</h1>
  </div>

  <div id="status" class="p1-turn">プレイヤー 1 の番です</div>

  <div id="container" class="board-container">
    <div id="board"></div>
  </div>

  <div class="controls">
    <button onclick="resetGame()">最初からやり直す</button>
  </div>

  <div class="rules">
    <strong>【ルール】</strong><br>
    ・2人で交互に1マス選んで「×」をつけます。<br>
    ・選んだマスから<b>斜めに延びるすべてのマス</b>にまとめて「×」が付きます。<br>
    ・「×」を書けなくなった方が負けです。
  </div>

  <script>
    const BOARD_SIZE = 8;
    let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
    let currentPlayer = 1; // 1 or 2
    let gameOver = false;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const containerEl = document.getElementById('container');

    function createBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          cell.addEventListener('click', () => handleClick(r, c));
          cell.addEventListener('mouseenter', () => handleHover(r, c, true));
          cell.addEventListener('mouseleave', () => handleHover(r, c, false));

          boardEl.appendChild(cell);
        }
      }
    }

    function getDiagonalCells(r, c) {
      const targets = [];
      const dirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
      
      targets.push([r, c]);

      dirs.forEach(([dr, dc]) => {
        let nr = r + dr;
        let nc = c + dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
          targets.push([nr, nc]);
          nr += dr;
          nc += dc;
        }
      });
      return targets;
    }

    function handleHover(r, c, isEntering) {
      if (gameOver || board[r][c] !== 0) return;
      const diags = getDiagonalCells(r, c);
      
      diags.forEach(([tr, tc]) => {
        if (board[tr][tc] === 0) {
          const cell = boardEl.children[tr * BOARD_SIZE + tc];
          if (isEntering) cell.classList.add('preview');
          else cell.classList.remove('preview');
        }
      });
    }

    function handleClick(r, c) {
      if (gameOver || board[r][c] !== 0) return;

      const diags = getDiagonalCells(r, c);
      diags.forEach(([tr, tc]) => {
        if (board[tr][tc] === 0) {
          board[tr][tc] = currentPlayer;
          const cell = boardEl.children[tr * BOARD_SIZE + tc];
          cell.textContent = '×';
          cell.classList.remove('preview');
          cell.classList.add(currentPlayer === 1 ? 'taken-p1' : 'taken-p2');
        }
      });

      if (!hasValidMove()) {
        gameOver = true;
        statusEl.textContent = `🎉 ゲーム終了！ プレイヤー ${currentPlayer} の勝利！`;
        statusEl.className = (currentPlayer === 1 ? 'p1-turn' : 'p2-turn') + ' game-over-status';
        containerEl.classList.add('game-over'); // 背景を黄色に変化
      } else {
        currentPlayer = currentPlayer === 1 ? 2 : 1;
        statusEl.textContent = `プレイヤー ${currentPlayer} の番です`;
        statusEl.className = currentPlayer === 1 ? 'p1-turn' : 'p2-turn';
      }
    }

    function hasValidMove() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] === 0) return true;
        }
      }
      return false;
    }

    function resetGame() {
      board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
      currentPlayer = 1;
      gameOver = false;
      statusEl.textContent = 'プレイヤー 1 の番です';
      statusEl.className = 'p1-turn';
      containerEl.classList.remove('game-over'); // 背景を元に戻す
      createBoard();
    }

    createBoard();
  </script>
</body>
</html>
