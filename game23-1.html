<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No. 23-1：60個の豆取りゲーム</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f2f5;
      margin: 0;
      padding: 10px 20px;
      height: 100vh;
      justify-content: space-between;
    }
    .header {
      text-align: center;
    }
    .game-num {
      font-size: 0.85rem;
      color: #666;
      font-weight: bold;
    }
    h1 {
      margin: 2px 0 6px 0;
      font-size: 1.4rem;
    }
    #status {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 6px;
      transition: all 0.3s;
      margin-bottom: 5px;
    }
    .p1-turn { color: #1e88e5; background: #e3f2fd; }
    .p2-turn { color: #e53935; background: #ffebee; }

    /* 勝利時のステータス強調 */
    .game-over-status {
      font-size: 1.4rem !important;
      background: #fff3e0 !important;
      color: #e65100 !important;
      border: 2px solid #ffa726;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .board-container {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 850px;
    }

    /* 終了時ハイライト */
    .board-container.game-over {
      background: #fff59d;
      box-shadow: 0 0 20px rgba(255, 214, 0, 0.8), 0 4px 12px rgba(0,0,0,0.15);
    }

    .bean-counter {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    /* 60個の豆グリッド (10列×6行) */
    #bean-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 15px;
      padding: 12px;
      background: #efebe9;
      border-radius: 8px;
    }

    .bean {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #8d6e63, #5d4037);
      border-radius: 50%;
      box-shadow: 0 2px 3px rgba(0,0,0,0.2);
      transition: all 0.2s;
    }

    /* 取られた豆 */
    .bean.taken {
      background: #d7ccc8;
      box-shadow: none;
      opacity: 0.2;
    }

    /* 操作ボタンエリア */
    .action-panel {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .take-btn {
      flex: 1;
      max-width: 140px;
      padding: 10px 6px;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      transition: background 0.15s;
    }

    /* プレイヤー1手番：青色ボタン */
    .take-btn.p1-btn {
      background: #1976d2;
    }
    .take-btn.p1-btn:hover:not(:disabled) {
      background: #1565c0;
    }

    /* プレイヤー2手番：赤色ボタン */
    .take-btn.p2-btn {
      background: #d32f2f;
    }
    .take-btn.p2-btn:hover:not(:disabled) {
      background: #c62828;
    }

    .take-btn:disabled {
      background: #cfd8dc !important;
      color: #90a4ae !important;
      cursor: not-allowed;
    }

    .controls {
      margin-top: 5px;
    }
    .reset-btn {
      padding: 8px 24px;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #4caf50;
      color: white;
      font-weight: bold;
    }
    .reset-btn:hover { background: #43a047; }

    .rules {
      width: 100%;
      max-width: 850px;
      padding: 8px 15px;
      background: white;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.3;
      color: #555;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="game-num">No. 23-1</div>
    <h1>60個の豆取りゲーム</h1>
  </div>

  <div id="status" class="p1-turn">プレイヤー 1 の番です</div>

  <div id="container" class="board-container">
    <div class="bean-counter">残りの豆: <span id="beans-left">60</span> 個</div>
    <div id="bean-grid"></div>

    <div class="action-panel">
      <button id="btn-1" class="take-btn p1-btn" onclick="takeBeans(1)">1個取る</button>
      <button id="btn-2" class="take-btn p1-btn" onclick="takeBeans(2)">2個取る</button>
      <button id="btn-3" class="take-btn p1-btn" onclick="takeBeans(3)">3個取る</button>
      <button id="btn-4" class="take-btn p1-btn" onclick="takeBeans(4)">4個取る</button>
      <button id="btn-5" class="take-btn p1-btn" onclick="takeBeans(5)">5個取る</button>
    </div>
  </div>

  <div class="controls">
    <button class="reset-btn" onclick="resetGame()">最初からやり直す</button>
  </div>

  <div class="rules">
    <span><b>【ルール】</b> 交互に1〜5個の豆を取っていきます。</span>
    <span><b>【勝利条件】</b> 最後の1個の豆を取った（取れなくなった方が負け）プレイヤーの勝ちです。</span>
  </div>

  <script>
    const TOTAL_BEANS = 60;
    let beansLeft = TOTAL_BEANS;

    let currentPlayer = 1;
    let gameOver = false;

    const gridEl = document.getElementById('bean-grid');
    const statusEl = document.getElementById('status');
    const containerEl = document.getElementById('container');
    const beansLeftEl = document.getElementById('beans-left');

    const btns = [
      document.getElementById('btn-1'),
      document.getElementById('btn-2'),
      document.getElementById('btn-3'),
      document.getElementById('btn-4'),
      document.getElementById('btn-5')
    ];

    function createGrid() {
      gridEl.innerHTML = '';
      for (let i = 0; i < TOTAL_BEANS; i++) {
        const bean = document.createElement('div');
        bean.className = 'bean';
        gridEl.appendChild(bean);
      }
      updateUI();
    }

    function takeBeans(count) {
      if (gameOver || count > beansLeft) return;

      beansLeft -= count;

      if (beansLeft === 0) {
        gameOver = true;
        updateUI();
        statusEl.textContent = `🎉 ゲーム終了！ 最後の豆を取った プレイヤー ${currentPlayer} の勝利！`;
        statusEl.className = (currentPlayer === 1 ? 'p1-turn' : 'p2-turn') + ' game-over-status';
        containerEl.classList.add('game-over');
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      statusEl.textContent = `プレイヤー ${currentPlayer} の番です`;
      statusEl.className = currentPlayer === 1 ? 'p1-turn' : 'p2-turn';
      updateUI();
    }

    function updateUI() {
      beansLeftEl.textContent = beansLeft;

      // 豆の表示更新
      for (let i = 0; i < TOTAL_BEANS; i++) {
        const bean = gridEl.children[i];
        if (i < TOTAL_BEANS - beansLeft) {
          bean.classList.add('taken');
        } else {
          bean.classList.remove('taken');
        }
      }

      // ボタン制御と色（クラス）の切り替え
      const btnClass = currentPlayer === 1 ? 'take-btn p1-btn' : 'take-btn p2-btn';

      btns.forEach((btn, index) => {
        const num = index + 1;
        btn.className = btnClass;
        btn.disabled = gameOver || num > beansLeft;
      });
    }

    function resetGame() {
      beansLeft = TOTAL_BEANS;
      currentPlayer = 1;
      gameOver = false;

      statusEl.textContent = 'プレイヤー 1 の番です';
      statusEl.className = 'p1-turn';
      containerEl.classList.remove('game-over');
      updateUI();
    }

    createGrid();
  </script>
</body>
</html>
