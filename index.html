<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敬和学園高等学校 数学表現ゲーム集</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      justify-content: space-between;
    }
    .header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 5px 0; font-size: 1.8rem; color: #1a237e; }
    .subtitle { font-size: 0.95rem; color: #666; }
    .portal-container {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .grid-menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      margin-top: 10px;
    }
    @media (max-width: 480px) { .grid-menu { grid-template-columns: 1fr; } }
    .nav-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      text-decoration: none;
      color: #333;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .nav-card:hover {
      background: #e8eaf6;
      border-color: #3f51b5;
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(63,81,181,0.2);
    }
    .nav-title { font-size: 1.25rem; font-weight: bold; color: #1a237e; }
    .nav-desc { font-size: 0.8rem; color: #666; margin-top: 4px; text-align: center; }
    .card-special {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      border-color: #42a5f5;
    }
    .card-special:hover {
      background: linear-gradient(135deg, #bbdefb, #90caf9);
      border-color: #1e88e5;
    }
    .card-special .nav-title { color: #0d47a1; }
    .footer-text { font-size: 0.8rem; color: #888; margin-top: 20px; }
  </style>
</head>
<body>

  </div>

      </a>
      <a href="index22.html" class="nav-card">

      </a>
      <a href="index23.html" class="nav-card">

      <a href="index24.html" class="nav-card">

      </a>
      <a href="index25.html" class="nav-card">
        <span class="nav-title">第25話</span>

      </a>
      <a href="index26.html" class="nav-card">
        <span class="nav-title">第26話</span>

      </a>
      <a href="game23-custom.html" class="nav-card card-special">

  <div class="footer-text">敬和学園高等学校　数学表現ゲームポータル</div>

</body>
