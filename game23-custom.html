<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom カウントアップゲーム（設定自由版）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f2f5;
      margin: 0;
      padding: 10px 20px;
      min-height: 100vh;
      justify-content: space-between;
    }
    .header { text-align: center; }
    .game-num { font-size: 0.85rem; color: #666; font-weight: bold; }
    h1 { margin: 2px 0 6px 0; font-size: 1.4rem; }

    #status {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 6px;
      transition: all 0.3s;
      margin-bottom: 5px;
    }
    .p1-turn { color: #1e88e5; background: #e3f2fd; }
    .p2-turn { color: #e53935; background: #ffebee; }

    .game-over-status {
      font-size: 1.4rem !important;
      background: #fff3e0 !important;
      color: #e65100 !important;
      border: 2px solid #ffa726;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .board-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 650px;
    }
    .board-container.game-over {
      background: #fff59d;
      box-shadow: 0 0 20px rgba(255, 214, 0, 0.8), 0 4px 12px rgba(0,0,0,0.15);
    }

    /* 設定エリア */
    .config-panel {
      width: 100%;
      background: #f8f9fa;
      border: 2px solid #dde1e5;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 550px) {
      .config-panel { grid-template-columns: 1fr; }
    }

    .config-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #37474f;
    }

    .config-item input[type="number"], .config-item select {
      font-size: 1rem;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-weight: bold;
    }

    .radio-group {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .radio-label {
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* メインゲームディスプレイ */
    .display-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0 20px 0;
    }

    .current-count-label {
      font-size: 0.9rem;
      color: #666;
      font-weight: bold;
    }

    .current-count-val {
      font-size: 4rem;
      font-weight: bold;
      color: #2c3e50;
      line-height: 1;
      margin: 5px 0;
    }

    .target-info {
      font-size: 0.95rem;
      color: #555;
      font-weight: bold;
    }

    /* カウント操作ボタン */
    .btn-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .count-btn {
      flex: 1;
      min-width: 80px;
      padding: 12px 8px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: all 0.15s;
    }

    .count-btn.p1-btn { background: #1976d2; }
    .count-btn.p1-btn:hover:not(:disabled) { background: #1565c0; transform: translateY(-2px); }

    .count-btn.p2-btn { background: #d32f2f; }
    .count-btn.p2-btn:hover:not(:disabled) { background: #c62828; transform: translateY(-2px); }

    .count-btn:disabled {
      background: #cfd8dc !important;
      color: #90a4ae !important;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* 履歴ログ */
    .history-box {
      width: 100%;
      max-height: 100px;
      overflow-y: auto;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: #555;
    }

    .controls { margin-top: 5px; }
    .reset-btn {
      padding: 8px 24px;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #4caf50;
      color: white;
      font-weight: bold;
    }
    .reset-btn:hover { background: #43a047; }

    .rules {
      width: 100%;
      max-width: 650px;
      padding: 8px 15px;
      background: white;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.3;
      color: #555;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="game-num">Custom Game</div>
    <h1>汎用カウントアップゲーム</h1>
  </div>

  <div id="status" class="p1-turn">プレイヤー 1 の番です</div>

  <div id="container" class="board-container">
    
    <!-- 条件設定エリア -->
    <div class="config-panel">
      <div class="config-item">
        <label>目標の数 (N):</label>
        <input type="number" id="cfg-target" value="31" min="5" max="200" onchange="applyConfig()">
      </div>

      <div class="config-item">
        <label>1度に言える最大数 (M):</label>
        <input type="number" id="cfg-max" value="3" min="1" max="10" onchange="applyConfig()">
      </div>

      <div class="config-item" style="grid-column: 1 / -1;">
        <label>勝利条件:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="win-rule" value="lose-on-target" checked onclick="applyConfig()">
            目標数 ($N$) を言ったら<b>負け</b> (ミザリー)
          </label>
          <label class="radio-label">
            <input type="radio" name="win-rule" value="win-on-target" onclick="applyConfig()">
            目標数 ($N$) を言ったら<b>勝ち</b> (ノーマル)
          </label>
        </div>
      </div>
    </div>

    <!-- カウントディスプレイ -->
    <div class="display-box">
      <div class="current-count-label">現在のカウント</div>
      <div id="current-val" class="current-count-val">0</div>
      <div id="target-info" class="target-info">目標: 31 (言ったら負け)</div>
    </div>

    <!-- ボタン操作エリア -->
    <div id="btn-panel" class="btn-panel"></div>

    <!-- 履歴ログ -->
    <div id="history-box" class="history-box">
      <div>ゲーム開始！ボタンを押して数字を加算してください。</div>
    </div>

  </div>

  <div class="controls">
    <button class="reset-btn" onclick="resetGame()">設定を適用してやり直す</button>
  </div>

  <div class="rules">
    <span><b>【カスタムルール】</b> 条件を変更して「必勝法（あまりの周期）」がどう変わるか観察してみよう！</span>
  </div>

  <script>
    let targetNum = 31;
    let maxAdd = 3;
    let winRule = 'lose-on-target'; // 'lose-on-target' or 'win-on-target'

    let currentVal = 0;
    let currentPlayer = 1;
    let gameOver = false;

    const cfgTargetEl = document.getElementById('cfg-target');
    const cfgMaxEl = document.getElementById('cfg-max');
    const currentValEl = document.getElementById('current-val');
    const targetInfoEl = document.getElementById('target-info');
    const statusEl = document.getElementById('status');
    const containerEl = document.getElementById('container');
    const btnPanelEl = document.getElementById('btn-panel');
    const historyBoxEl = document.getElementById('history-box');

    function applyConfig() {
      targetNum = parseInt(cfgTargetEl.value) || 31;
      maxAdd = parseInt(cfgMaxEl.value) || 3;

      const rules = document.getElementsByName('win-rule');
      for (let r of rules) {
        if (r.checked) winRule = r.value;
      }

      resetGame();
    }

    function renderButtons() {
      btnPanelEl.innerHTML = '';

      for (let i = 1; i <= maxAdd; i++) {
        const btn = document.createElement('button');
        btn.className = `count-btn ${currentPlayer === 1 ? 'p1-btn' : 'p2-btn'}`;
        btn.textContent = `+${i}`;
        btn.onclick = () => addCount(i);
        btnPanelEl.appendChild(btn);
      }

      updateButtonStates();
    }

    function updateButtonStates() {
      const buttons = btnPanelEl.querySelectorAll('.count-btn');
      buttons.forEach((btn, idx) => {
        const addAmount = idx + 1;
        const nextVal = currentVal + addAmount;
        btn.disabled = gameOver || (nextVal > targetNum);
        btn.className = `count-btn ${currentPlayer === 1 ? 'p1-btn' : 'p2-btn'}`;
      });
    }

    function addCount(amount) {
      if (gameOver) return;

      const prevVal = currentVal;
      currentVal += amount;
      currentValEl.textContent = currentVal;

      // ログ追加
      const logItem = document.createElement('div');
      logItem.textContent = `P${currentPlayer}: ${prevVal} ➡ ${currentVal} (+${amount})`;
      historyBoxEl.appendChild(logItem);
      historyBoxEl.scrollTop = historyBoxEl.scrollHeight;

      // 勝敗判定
      if (currentVal >= targetNum) {
        gameOver = true;
        let winner = 1;

        if (winRule === 'lose-on-target') {
          // 言った人が負け
          winner = currentPlayer === 1 ? 2 : 1;
        } else {
          // 言った人が勝ち
          winner = currentPlayer;
        }

        statusEl.textContent = `🎉 ゲーム終了！ 目標 ${targetNum} に達しました。 プレイヤー ${winner} の勝利！`;
        statusEl.className = (winner === 1 ? 'p1-turn' : 'p2-turn') + ' game-over-status';
        containerEl.classList.add('game-over');
        updateButtonStates();
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      statusEl.textContent = `プレイヤー ${currentPlayer} の番です`;
      statusEl.className = currentPlayer === 1 ? 'p1-turn' : 'p2-turn';
      updateButtonStates();
    }

    function resetGame() {
      currentVal = 0;
      currentPlayer = 1;
      gameOver = false;

      currentValEl.textContent = '0';
      statusEl.textContent = 'プレイヤー 1 の番です';
      statusEl.className = 'p1-turn';
      containerEl.classList.remove('game-over');

      const ruleText = winRule === 'lose-on-target' ? '言ったら負け' : '言ったら勝ち';
      targetInfoEl.textContent = `目標: ${targetNum} (${ruleText})`;

      historyBoxEl.innerHTML = '<div>ゲーム開始！ボタンを押して数字を加算してください。</div>';

      renderButtons();
    }

    // 初期化
    applyConfig();
  </script>
</body>
</html>
