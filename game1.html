<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8x8 斜め×取りゲーム</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; }
    #status {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .p1-turn { color: #1e88e5; }
    .p2-turn { color: #e53935; }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 45px);
      grid-template-rows: repeat(8, 45px);
      gap: 2px;
      background: #333;
      padding: 4px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .cell {
      width: 45px;
      height: 45px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .cell.preview { background: #e0f7fa; }
    .cell.taken-p1 { background: #bbdefb; color: #1565c0; cursor: not-allowed; }
    .cell.taken-p2 { background: #ffcdd2; color: #c62828; cursor: not-allowed; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #4caf50;
      color: white;
      font-weight: bold;
    }
    button:hover { background: #43a047; }
  </style>
</head>
<body>

  <h1>8x8 斜め×取りゲーム</h1>
  <div id="status" class="p1-turn">プレイヤー 1 の番です</div>
  <div id="board"></div>
  <button onclick="resetGame()">最初からやり直す</button>

  <script>
    const BOARD_SIZE = 8;
    let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
    let currentPlayer = 1; // 1 or 2
    let gameOver = false;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');

    function createBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          cell.addEventListener('click', () => handleClick(r, c));
          cell.addEventListener('mouseenter', () => handleHover(r, c, true));
          cell.addEventListener('mouseleave', () => handleHover(r, c, false));

          boardEl.appendChild(cell);
        }
      }
    }

    function getDiagonalCells(r, c) {
      const targets = [];
      const dirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
      
      // 選択マス自体
      targets.push([r, c]);

      // 4方向の斜め
      dirs.forEach(([dr, dc]) => {
        let nr = r + dr;
        let nc = c + dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
          targets.push([nr, nc]);
          nr += dr;
          nc += dc;
        }
      });
      return targets;
    }

    function handleHover(r, c, isEntering) {
      if (gameOver || board[r][c] !== 0) return;
      const diags = getDiagonalCells(r, c);
      
      diags.forEach(([tr, tc]) => {
        if (board[tr][tc] === 0) {
          const cell = boardEl.children[tr * BOARD_SIZE + tc];
          if (isEntering) cell.classList.add('preview');
          else cell.classList.remove('preview');
        }
      });
    }

    function handleClick(r, c) {
      if (gameOver || board[r][c] !== 0) return;

      const diags = getDiagonalCells(r, c);
      diags.forEach(([tr, tc]) => {
        if (board[tr][tc] === 0) {
          board[tr][tc] = currentPlayer;
          const cell = boardEl.children[tr * BOARD_SIZE + tc];
          cell.textContent = '×';
          cell.classList.remove('preview');
          cell.classList.add(currentPlayer === 1 ? 'taken-p1' : 'taken-p2');
        }
      });

      // 次のプレイヤーで打てる手があるか確認
      const nextPlayer = currentPlayer === 1 ? 2 : 1;
      if (!hasValidMove()) {
        gameOver = true;
        statusEl.textContent = `ゲーム終了！ プレイヤー ${currentPlayer} の勝利！`;
        statusEl.className = currentPlayer === 1 ? 'p1-turn' : 'p2-turn';
      } else {
        currentPlayer = nextPlayer;
        statusEl.textContent = `プレイヤー ${currentPlayer} の番です`;
        statusEl.className = currentPlayer === 1 ? 'p1-turn' : 'p2-turn';
      }
    }

    function hasValidMove() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] === 0) return true;
        }
      }
      return false;
    }

    function resetGame() {
      board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
      currentPlayer = 1;
      gameOver = false;
      statusEl.textContent = 'プレイヤー 1 の番です';
      statusEl.className = 'p1-turn';
      createBoard();
    }

    createBoard();
  </script>
</body>
</html>
